{{ define "main" }}
<div class="article-container">
  <article class="article">
    <h1>{{ .Title }}</h1>
    <div class="article-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    </div>
    <div class="article-content">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
