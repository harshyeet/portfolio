<div class="header-wrapper">
  <header class="header">
    <!-- 2-State Liquid Glass Theme Switcher -->
    <fieldset class="switcher">
      <legend class="switcher__legend">choose theme</legend>
      <label class="switcher__option">
        <input class="switcher__input" type="radio" name="theme" value="light" aria-label="light mode" />
        <svg class="switcher__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 36 36">
          <path fill="var(--switcher-icon-color)" fill-rule="evenodd"
            d="M18 12a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" clip-rule="evenodd" />
          <path fill="var(--switcher-icon-color)"
            d="M17 6.038a1 1 0 1 1 2 0v3a1 1 0 0 1-2 0v-3ZM24.244 7.742a1 1 0 1 1 1.618 1.176L24.1 11.345a1 1 0 1 1-1.618-1.176l1.763-2.427ZM29.104 13.379a1 1 0 0 1 .618 1.902l-2.854.927a1 1 0 1 1-.618-1.902l2.854-.927ZM29.722 20.795a1 1 0 0 1-.619 1.902l-2.853-.927a1 1 0 1 1 .618-1.902l2.854.927ZM25.862 27.159a1 1 0 0 1-1.618 1.175l-1.763-2.427a1 1 0 1 1 1.618-1.175l1.763 2.427ZM19 30.038a1 1 0 0 1-2 0v-3a1 1 0 1 1 2 0v3ZM11.755 28.334a1 1 0 0 1-1.618-1.175l1.764-2.427a1 1 0 1 1 1.618 1.175l-1.764 2.427ZM6.896 22.697a1 1 0 1 1-.618-1.902l2.853-.927a1 1 0 1 1 .618 1.902l-2.853.927ZM6.278 15.28a1 1 0 1 1 .618-1.901l2.853.927a1 1 0 1 1-.618 1.902l-2.853-.927ZM10.137 8.918a1 1 0 0 1 1.618-1.176l1.764 2.427a1 1 0 0 1-1.618 1.176l-1.764-2.427Z" />
        </svg>
      </label>
      <label class="switcher__option">
        <input class="switcher__input" type="radio" name="theme" value="dark" aria-label="dark mode" checked />
        <svg class="switcher__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 36 36">
          <path fill="var(--switcher-icon-color)"
            d="M12.5 8.473a10.968 10.968 0 0 1 8.785-.97 7.435 7.435 0 0 0-3.737 4.672l-.09.373A7.454 7.454 0 0 0 28.732 20.4a10.97 10.97 0 0 1-5.232 7.125l-.497.27c-5.014 2.566-11.175.916-14.234-3.813l-.295-.483C5.53 18.403 7.13 11.93 12.017 8.77l.483-.297Zm4.234.616a8.946 8.946 0 0 0-2.805.883l-.429.234A9 9 0 0 0 10.206 22.5l.241.395A9 9 0 0 0 22.5 25.794l.416-.255a8.94 8.94 0 0 0 2.167-1.99 9.433 9.433 0 0 1-2.782-.313c-5.043-1.352-8.036-6.535-6.686-11.578l.147-.491c.242-.745.573-1.44.972-2.078Z" />
        </svg>
      </label>
      <div class="switcher__pill"></div>
    </fieldset>

    <!-- Logo -->
    <a href="{{ site.Home.RelPermalink }}" class="logo">{{ .Site.Params.logo_text | default "Harshit" }}<span
        class="logo-dot">{{ .Site.Params.logo_dot | default ":)" }}</span></a>

    <!-- Desktop Nav Items -->
    <nav class="desktop-nav">
      <ul class="nav-links">
        <li class="nav-item"><a href="{{ site.Home.RelPermalink }}"
            class="nav-link{{ if .IsHome }} active{{ end }}">home</a></li>
        <li class="nav-item"><span class="nav-separator">/</span></li>
        <li class="nav-item"><a href="{{ " blogs/" | relURL }}" class="nav-link{{ if or (eq .Section " blogs") (in
            .RelPermalink "/blogs" ) }} active{{ end }}">blogs</a></li>
        <li class="nav-item"><span class="nav-separator">/</span></li>
        <li class="nav-item"><a href="{{ " contact/" | relURL }}" class="nav-link{{ if or (eq .Section " contact") (in
            .RelPermalink "/contact" ) }} active{{ end }}">contact</a></li>
        <li class="nav-item"><span class="nav-separator">/</span></li>
        <li class="nav-item"><a href="{{ .Site.Params.github_url | default " https://github.com/harshyeet" }}"
            target="_blank" rel="noopener noreferrer" class="nav-link">github</a></li>
      </ul>
    </nav>

    <!-- Mobile Hamburger Button -->
    <button class="mobile-nav-toggle" aria-label="toggle navigation menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
      </svg>
    </button>

    <!-- Mobile Nav Dropdown -->
    <div class="mobile-menu">
      <ul class="mobile-nav-list">
        <li class="mobile-nav-item"><a href="{{ site.Home.RelPermalink }}"
            class="nav-link{{ if .IsHome }} active{{ end }}">home</a></li>
        <li class="mobile-nav-item"><a href="{{ " blogs/" | relURL }}" class="nav-link{{ if or (eq .Section " blogs")
            (in .RelPermalink "/blogs" ) }} active{{ end }}">blogs</a></li>
        <li class="mobile-nav-item"><a href="{{ " contact/" | relURL }}" class="nav-link{{ if or (eq .Section "
            contact") (in .RelPermalink "/contact" ) }} active{{ end }}">contact</a></li>
        <li class="mobile-nav-item"><a href="{{ .Site.Params.github_url | default " https://github.com/harshyeet" }}"
            target="_blank" rel="noopener noreferrer" class="nav-link">github</a></li>
      </ul>
    </div>
  </header>
</div>
