name: Generate Blog Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'blogs/*.html'

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse Blog Metadata & Update Manifest
        run: |
          python -c "
          import os, json, re
          from bs4 import BeautifulSoup

          blogs_dir = 'blogs'
          posts = []

          for filename in os.listdir(blogs_dir):
              if filename.endswith('.html') and filename != 'index.html':
                  filepath = os.path.join(blogs_dir, filename)
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # Attempt to parse json script metadata
                  match = re.search(r'<script[^>]*id=[\"\']post-metadata[\"\'][^>]*>(.*?)</script>', content, re.DOTALL)
                  if match:
                      try:
                          meta = json.loads(match.group(1).strip())
                          posts.append({
                              'filename': filename,
                              'title': meta.get('title', filename),
                              'date': meta.get('date', '1970-01-01'),
                              'summary': meta.get('summary', '')
                          })
                      except Exception as e:
                          print(f'Error parsing metadata in {filename}: {e}')

          # Sort posts newest-first
          posts.sort(key=lambda x: x['date'], reverse=True)

          manifest_path = os.path.join(blogs_dir, 'manifest.json')
          with open(manifest_path, 'w', encoding='utf-8') as f:
              json.dump(posts, f, indent=2)

          print(f'Manifest generated with {len(posts)} posts.')
          "

      - name: Commit and push if manifest changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs/manifest.json
          if git diff --staged --quiet; then
            echo "No changes to manifest.json"
          else
            git commit -m "auto: update blogs/manifest.json"
            git push
          fi
